name: Bug Report
description: File a bug report
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please provide as many details as possible, we must be able to
        understand the bug in order to fix it.

        Don't forget to search the issue tracker in case there is
        already an open issue for the bug you found.

        Please report ankle bugs here, not to foot.
  - type: input
    id: version
    attributes:
      label: Ankle Version
      description: "The output of `ankle --version`"
      placeholder: "ankle version: 1.28.0-28-g13cbd737 (Oct 09 2026, branch 'master') -pgo +ime +graphemes +toplevel-tag +blur -assertions"
    validations:
      required: true
  - type: input
    id: term
    attributes:
      label: TERM environment variable
      description: "The output of `echo $TERM`"
      placeholder: "foot"
    validations:
      required: true
  - type: input
    id: compositor
    attributes:
      label: Compositor Name and Version
      description: "The name and version of your compositor"
      placeholder: "sway version 1.9"
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution
      description: "The name of the Linux distribution, or BSD flavor, you are running. And, if applicable, the version"
      placeholder: "Fedora Workstation 41"
    validations:
      required: true
  - type: input
    id: multiplexer
    attributes:
      label: Terminal multiplexer
      description: "Terminal multiplexers are terminal emulators themselves, therefore the issue may be in the multiplexer, not ankle. Please list which multiplexer(s) you use here (and mention in the problem description below if the issue only occurs in the multiplexer, but not in bare metal ankle)"
      placeholder: "tmux, zellij"
  - type: input
    id: application
    attributes:
      label: Shell, TUI, application
      description: "Application(s) in which the problem occurs (list all known)"
      placeholder: "bash, neovim"
  - type: checkboxes
    id: server
    attributes:
      label: Server/standalone mode
      description: Does the issue occur in ankle server, or standalone mode, or both? Note that you **cannot** test standalone mode by manually running `ankle` from an `ankleclient` instance, since then the standalone ankle will simply inherit the server process' context.
      options:
        - label: Standalone
        - label: Server
  - type: textarea
    id: config
    attributes:
      label: Ankle config
      description: Paste your entire `ankle.ini` (or `foot.ini`, if you use that) here (do not forget to sanitize it!)
      render: ini
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Description of Bug and Steps to Reproduce
      description: |
        Exactly what steps can someone else take to see the bug
        themselves? What happens?
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Please provide as many details as possible, we must be able to
        understand the bug in order to fix it.

        Other software
        --------------

        **Compositors**: have you tested other compositors? Does the
        issue happen on all of them, or only your main compositor?

        **Terminal multiplexers**: are you using tmux, zellij, or any
        other terminal multiplexer?  Does the bug happen in a plain
        ankle instance?

        **IME** do you use an IME (e.g. fcitx5, ibus etc)? Which one?
        Does the bug happen if you disable the IME?

        Obtaining logs and stacktraces
        ------------------------------

        Use a [debug
        build](https://github.com/DaGhostman/ankle/blob/master/INSTALL.md#debug-build)
        of ankle if possible, to get a better quality stacktrace in
        case of a crash.

        Run ankle with logging enabled:
        ```sh
        ankle -d info 2> ankle.log
        ```

        In many cases, tracing the Wayland communication is extremely helpful:
        ```sh
        WAYLAND_DEBUG=1 ankle -d info 2> ankle.wayland.log
        ```

        Reproduce your problem as quickly as possible, and then exit ankle.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs, stacktraces, etc.
  - type: markdown
    attributes:
      value: |
        Please attach files instead of pasting the logs, if the logs are large
