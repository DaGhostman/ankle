# Cyber: Data rain in netrunner green: a living cursor, every typed character burns in and your text shows in green.
#
# Ported from ghostty-cursor-fx by AONIR (MIT); see LICENSE.
#
# Use it by including this file from your ankle.ini (after your own
# [colors-dark]/[colors-light] sections, since it sets the cursor color):
#
#   include=<this directory>/cyber.ini
#
# The effect's idle animations (breathing, crackle, ...) only run while
# shaders animate: with custom-shader-animation=auto (the default) that is
# for a moment after the cursor moves. Set custom-shader-animation=true to
# keep them running while the window is focused (uses more power).

[main]
custom-shader=cyber-cursor.glsl

[cursor]
style=block
blink=no

[colors-dark]
cursor=111111 50e080

[colors-light]
cursor=111111 50e080
